# Picture plan for brief 004, FI3 (art director, 2026-11-22). Read by lukio-runko v0.3.0 after data/images.yaml and
# data/images-illustrations.yaml (the style line is in data/images.yaml). The plan follows the critic's proposal 4 in
# docs/research/2026-11-22-fi3-scouting.json. Formats as in the two older files.
# Diagrams: content/diagrams/<id>.mmd, rendered to site-src/img/<id>.svg by tools/render_diagrams.py; `fallback: svg`
# tells the image tool to skip them. expected_labels are the SVG text lines in order; facts_from names the source.
# Picture rules: no text, letters or numbers; no likeness of real people from the model; adults; no party symbols,
# flags, weapons, riots or violence; respectful of every worldview; calm. The alt of an illustration is provisional
# until the picture exists and is checked at full size.
images:
  # ---------------------------------------------------------------- FI3 diagrams (brief 004)
  - id: dg-fi3-sopimusteoriat
    kind: diagram
    model: nano-banana
    fallback: svg
    aspect: "4:5"
    page: fi3-01-yhteiskuntasopimus
    placement: Opiskelijalle
    prompt: "Mermaid source content/diagrams/dg-fi3-sopimusteoriat.mmd, rendered to site-src/img/dg-fi3-sopimusteoriat.svg."
    alt: >-
      Kaavio kolmesta sopimusteoriasta. Vasemmalla on laatikko luonnontila ja sopimus, ja siitä lähtee nuoli kolmeen
      allekkaiseen laatikkoon: Hobbesilla luonnontila on jokaisen sota jokaista vastaan, ja valta kuuluu ehdottomalle
      hallitsijalle; Lockella riidoille ei ole tuomaria, ja sopimus synnyttää rajoitetun hallituksen; Rousseaulla
      luonnontila on rauhallinen ja yksinkertainen, ja valta kuuluu kansan yhteiselle tahdolle.
    expected_labels: ["Luonnontila", "ja sopimus", "Hobbes:", "jokaisen sota", "jokaista vastaan;", "ehdoton",
      "hallitsija", "Locke:", "riidoille ei ole", "tuomaria;", "rajoitettu", "hallitus", "Rousseau:", "rauhallinen ja",
      "yksinkertainen;", "kansan yhteinen", "tahto"]
    facts_from:
      - {topic: fi3-01-yhteiskuntasopimus, section: "Opiskelijalle / Kolme sopimusteoriaa (taulukko)"}
  - id: dg-fi3-vallan-muodot
    kind: diagram
    model: nano-banana
    fallback: svg
    aspect: "2:3"
    page: fi3-02-valta-ja-oikeutus
    placement: Opiskelijalle
    prompt: "Mermaid source content/diagrams/dg-fi3-vallan-muodot.mmd, rendered to site-src/img/dg-fi3-vallan-muodot.svg."
    alt: >-
      Kaavio neljästä vallan muodosta. Vasemmalla olevasta vallasta lähtee nuoli neljään allekkaiseen laatikkoon:
      pakko toimii uhkalla tai pakkokeinolla; auktoriteettia noudatetaan, koska sitä pidetään pätevänä tai
      oikeutettuna; vaikuttaminen toimii perusteluilla, houkuttelulla ja esimerkillä; rakenteellisessa vallassa
      säännöt, roolit ja odotukset rajaavat vaihtoehtoja ilman käskyä.
    expected_labels: ["Valta", "Pakko:", "uhka tai", "pakkokeino", "Auktoriteetti:", "pidetään", "pätevänä tai",
      "oikeutettuna", "Vaikuttaminen:", "perustelut,", "houkuttelu,", "esimerkki", "Rakenteellinen",
      "valta: säännöt,", "roolit ja odotukset", "rajaavat", "vaihtoehtoja", "ilman käskyä"]
    facts_from:
      - {topic: fi3-02-valta-ja-oikeutus, section: "Opiskelijalle / Mitä valta on? (taulukko)"}
  - id: dg-fi3-vapaus
