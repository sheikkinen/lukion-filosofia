      read: 2026-11-22
      credit: "Kuva: Wikimedia Commons, julkinen omaisuus"
      note: "Placed on topic 07 (Humen vapaus section is inside the Opiskelijalle section)."
  - id: pd-09-platonin-luola
    kind: illustration
    model: nano-banana
    fallback: svg
    aspect: "4:3"
    page: fi1-09-tieto-ja-tiede
    placement: Opiskelijalle
    prompt: >-
      Not generated. Public-domain artwork from Wikimedia Commons, converted to site-src/img/pd-09-platonin-
      luola.webp. `model` and
      `fallback: svg` follow the sibling convention: the schema requires a model, and the fallback tells the image tool
      to skip this entry.
    alt: >-
      Jan Saenredamin kaiverros vuodelta 1604 Platonin luolavertauksesta. Oikealla joukko ihmisiä istuu ja
      seisoo tiiviisti korkean muurin takana, ja muurin päällä kulkee pienten hahmojen kulkue, jonka varjot
      heijastuvat seinälle. Vasemmalla muutama mies katsoo kaaren läpi luolan suulle, jossa näkyy valoisa
      ulkomaailma. Kuvan alareunassa on latinankielinen runo.
    commons:
      title: "Platon Cave Sanraedam 1604.jpg"
      file_url: "https://commons.wikimedia.org/wiki/File:Platon_Cave_Sanraedam_1604.jpg"
      work: "Jan Saenredam (Cornelis van Haarlemin maalauksen mukaan), Platonin luola (kaiverrus, 1604)"
      artist_death_year: 1607
      licence_tag: "CC-PD-Mark; Commons category 'Author died more than 100 years ago'; no explicit PD-Art or
      PD-old template shown on the page, so the public-domain status rests on the age of the engraving (artist
      d. 1607)"
      source_institution: "British Museum, objekti P_1852-1211-120"
      read: 2026-11-22
      credit: "Kuva: Wikimedia Commons, julkinen omaisuus"
      note: "Alt notes the Latin verse under the picture. Original 1600x1166, webp 1000x729 to stay under 200
      KB. PD tag caveat: see licence field."
