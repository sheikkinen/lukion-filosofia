  # ---------------------------------------------------------------- FI3 illustrations (nano-banana, brief 004)
  - id: il-fi3
    kind: illustration
    model: nano-banana
    aspect: "16:9"
    page: fi3
    placement: header
    decorative: true
    prompt: >-
      A wide sunny town square with low trees and long wooden benches. Many small adults of different ages sit and
      stand in loose groups, talking calmly with open hand gestures; one older person listens, a young adult leans in
      to speak. Pigeons on the paving, a small fountain, plain house fronts with no signs, no flags and no banners.
    alt: >-
      Ihmiset istuvat penkeillä ja seisovat ryhmissä aurinkoisella kaupungin aukiolla ja keskustelevat rauhallisesti.
  - id: il-fi3-01-yhteiskuntasopimus
    kind: illustration
    model: nano-banana
    aspect: "16:9"
    page: fi3-01-yhteiskuntasopimus
    placement: header
    decorative: true
    prompt: >-
      A small field research camp in an empty open landscape at dusk: a few canvas tents and a lantern. Five adults
      who have only just met sit around a folding table, seen from the side and behind, writing on blank sheets of
      paper and passing a pencil to each other. Soft violet sky, first stars, a calm cooperative mood.
    alt: >-
      Viisi ihmistä istuu hämärässä telttaleirin pöydän ääressä ja kirjoittaa yhdessä tyhjille papereille.
  - id: il-fi3-02-valta-ja-oikeutus
    kind: illustration
    model: nano-banana
    aspect: "16:9"
    page: fi3-02-valta-ja-oikeutus
    placement: header
    decorative: true
    prompt: >-
      A bright simple meeting room with a long plain table. At the far end stands one tall empty high-backed wooden
      chair, noticeably taller than the others. Several adults sit along the table seen from behind, looking towards
      the empty chair. Daylight from tall windows, calm and quiet, no emblems, no flags.
    alt: >-
      Ihmiset istuvat valoisassa huoneessa pitkän pöydän molemmilla puolilla, ja pöydän päässä on korkea tyhjä tuoli.
  - id: il-fi3-03-poliittinen-vapaus
    kind: illustration
    model: nano-banana
    aspect: "16:9"
    page: fi3-03-poliittinen-vapaus
    placement: header
    decorative: true
    prompt: >-
      A low garden wall with an open wrought-iron gate in the foreground. One adult, seen from behind, stands on the
      path just at the open gate, about to step through. Beyond it a wide green park where other adults walk, cycle
      and sit on the grass as they like. Morning light, long soft shadows, a feeling of open space.
    alt: >-
      Ihminen seisoo selin katsojaan avoimen portin kohdalla, ja portin takana muut kävelevät vapaasti puistossa.
  - id: il-fi3-04-tasa-arvo-ja-oikeudenmukaisuus
    kind: illustration
    model: nano-banana
    aspect: "16:9"
    page: fi3-04-tasa-arvo-ja-oikeudenmukaisuus
    placement: header
    decorative: true
    prompt: >-
      An outdoor running track on a curve seen from slightly above. Several adult runners of different body types,
      one using a sports wheelchair, wait calmly at staggered starting positions in their lanes, so that the start
      lines sit at different places along the curve. Plain lanes with no numbers or markings, green grass, soft
      morning light.
    alt: >-
      Juoksijat odottavat juoksuradan kaarteessa porrastetuilla lähtöpaikoilla, ja yksi heistä istuu
      urheilupyörätuolissa.
  - id: il-fi3-05-oikeusvaltio-ja-demokratia
    kind: illustration
    model: nano-banana
    aspect: "16:9"
    page: fi3-05-oikeusvaltio-ja-demokratia
    placement: header
    decorative: true
    prompt: >-
      A calm city square with three separate buildings of different simple shapes, one with columns, one low and
      wide, one with a slim square tower, joined to each other by light footbridges above the square. Small
      adults cross the bridges and walk on the square below. Clear sky, no flags, no signs, no emblems.
    alt: >-
      Aukion ympärillä on kolme erillistä rakennusta, joita yhdistävät kävelysillat, ja ihmiset kulkevat siltoja
      pitkin.
  - id: il-fi3-06-liberalismi-ja-konservatismi
    kind: illustration
    model: nano-banana
    aspect: "16:9"
    page: fi3-06-liberalismi-ja-konservatismi
    placement: header
    decorative: true
    prompt: >-
      An old heritage library with tall wooden shelves of plain blank-spined books, whose wide doors stand open onto
      a sunny garden. Inside, a few adults of different ages read together at a long table under old lamps; outside,
      other adults read alone on separate benches among the flowers. Warm light inside, fresh light outside, equal
      weight to both halves.
    alt: >-
      Vanhan kirjaston ovi on auki puutarhaan; sisällä ihmiset lukevat yhdessä pitkän pöydän ääressä ja ulkona
      yksin penkeillä.
  - id: il-fi3-07-sosialismi-ja-anarkismi
    kind: illustration
    model: nano-banana
    aspect: "16:9"
    page: fi3-07-sosialismi-ja-anarkismi
    placement: header
    decorative: true
    prompt: >-
      A bright shared woodworking workshop with a big open door onto a community vegetable garden. Inside, several
      adults work together at one long workbench, handing each other simple hand tools; outside, neighbours share a
      wheelbarrow and water the beds. Calm cooperative mood, no flags, no banners, no raised fists, no symbols.
    alt: >-
      Ihmiset tekevät yhdessä töitä yhteisen höyläpenkin ääressä verstaalla, ja ulkona naapurit hoitavat yhteistä
      kasvimaata.
  - id: il-fi3-08-nationalismi-ja-kulttuurien-kohtaaminen
    kind: illustration
    model: nano-banana
    aspect: "16:9"
    page: fi3-08-nationalismi-ja-kulttuurien-kohtaaminen
    placement: header
    decorative: true
    prompt: >-
      A lively harbour market on a calm morning, with small wooden boats at the quay and simple stalls of bread, fish,
      fruit and textiles in plain colours. Adults of many different backgrounds and clothing styles buy, sell and
      chat with each other; two people taste food from a neighbouring stall. No flags, no signs, no religious symbols.
    alt: >-
      Satamatorilla erilaiset ihmiset ostavat, myyvät ja juttelevat kojujen ääressä laiturin vieressä.
  - id: il-fi3-09-utopiat-dystopiat-ja-teknologia
    kind: illustration
    model: nano-banana
    aspect: "16:9"
    page: fi3-09-utopiat-dystopiat-ja-teknologia
    placement: header
    decorative: true
    prompt: >-
      A small island city in a calm sea, seen from a grassy hill where two adults sit with their backs to the viewer.
      The left half of the city is full of rooftop gardens and trees; the right half has neat identical buildings
      and many tall thin poles with small round cameras. Soft hazy light, quiet and thoughtful, not frightening.
    alt: >-
      Kaksi ihmistä katsoo kukkulalta saarikaupunkia, jonka toisella puolella on puutarhoja ja toisella kamerapylväitä.
  - id: il-fi3-10-hyvinvointivaltio-ja-eriarvoisuus
    kind: illustration
    model: nano-banana
    aspect: "16:9"
    page: fi3-10-hyvinvointivaltio-ja-eriarvoisuus
    placement: header
    decorative: true
    prompt: >-
      A small town on a gentle hillside with homes of very different sizes side by side: a large house with a garden,
      a row of small terraced homes and a modest apartment block. A shared playground and a library-like low
      building in the middle, a few adults walking. Slim white wind turbines on the distant horizon, clear evening
      light.
    alt: >-
      Rinteellä on erikokoisia koteja vierekkäin, keskellä yhteinen leikkipuisto, ja taivaanrannassa on tuulivoimaloita.
