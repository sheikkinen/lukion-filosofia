      Portret van René Descartes.jpg', source a 1997 book, 'after Hals'); this file is a museum-documented
      panel."
  - id: pd-07-hume
    kind: illustration
    model: nano-banana
    fallback: svg
    aspect: "3:4"
    page: fi1-07-vapaus-ja-valttamattomyys
    placement: Opiskelijalle
    prompt: >-
      Not generated. Public-domain artwork from Wikimedia Commons, converted to site-src/img/pd-07-hume.webp.
      `model` and
      `fallback: svg` follow the sibling convention: the schema requires a model, and the fallback tells the image tool
      to skip this entry.
    alt: >-
      Allan Ramsayn maalaama muotokuva David Humesta vuodelta 1766. Pyöreäkasvoinen mies istuu etuviistosta
      kuvattuna, yllään kirkkaanpunainen takki kultanauhoin ja valkoinen paita. Hänellä on harmaa peruukki ja
      rauhallinen, hieman hymyilevä ilme.
    commons:
      title: "Allan Ramsay - David Hume, 1711 - 1776. Historian and philosopher - Google Art Project.jpg"
      file_url: "https://commons.wikimedia.org/wiki/File:Allan_Ramsay_-_David_Hume,_1711_-_1776._Historian_and_philosopher_-_Google_Art_Project.jpg"
      work: "Allan Ramsay, David Hume (öljymaalaus, 1766)"
