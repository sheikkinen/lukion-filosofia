# Picture plan for brief 002, FI1 (art director, 2026-11-22). Read by lukio-runko (pictures.py: build placement;
# images.py: generation). This file holds the style line and the diagrams; data/images-illustrations.yaml holds the
# illustrations. The plan follows the critic's proposal 5 in docs/research/2026-11-22-scouting.json.
# Diagrams are not drawn by an image model. The Mermaid sources are in content/diagrams/<id>.mmd and are rendered to
# site-src/img/<id>.svg by tools/render_diagrams.py before the build. `fallback: svg` tells the image tool to skip
# them, and `model` is kept only because the schema requires it. `prompt` records where the source is.
# Diagrams carry information: alt is the full description. expected_labels are the exact text strings of the SVG,
# one per rendered line (a label with a line break is listed line by line). facts_from names the topic section the
# wording comes from. Placement: the H2 section the diagram follows (the lesson view shows diagrams in one place).
# Picture rules for every illustration: no text, letters or numbers; no likeness of real people; adults only, of
# varied genders and backgrounds; respectful of every religion; no weapons or injuries; calm.
style: >-
  Calm flat editorial illustration with soft simple shapes, gentle grain-free shading and clean edges. Limited
  palette of deep indigo, warm sand, pale sky blue, muted gold and soft coral on an off-white background. Light,
  airy composition with generous empty space. Small figures, often seen from behind, natural relaxed poses, simple
  calm faces when seen at all. Adults only, of varied genders, skin tones, body types and backgrounds, in everyday
  casual clothes. Fictional people only, no likeness of any real or historical person, no celebrities. No religious
  figures or symbols, no weapons, no injuries, no chains, nothing frightening. Absolutely no text, letters, numbers,
  words, signs, logos, brand marks or watermarks anywhere; any books, papers, screens and rulers are blank or show
  only simple abstract shapes. Full-bleed edge-to-edge composition with no border, frame or margin.
images:
  - id: dg-fi1-filosofian-alat
    kind: diagram
    model: nano-banana
    fallback: svg
    aspect: "2:3"
    page: fi1-01-mita-filosofia-on
    placement: Opiskelijalle
    prompt: "Mermaid source content/diagrams/dg-fi1-filosofian-alat.mmd, rendered to site-src/img/dg-fi1-filosofian-alat.svg."
    alt: >-
      Kaavio filosofian kuudesta osa-alueesta. Vasemmalla olevasta filosofiasta lähtee nuoli kuuteen allekkaiseen
      laatikkoon: metafysiikka eli mitä on olemassa, tietoteoria eli mitä tieto on, logiikka eli mikä tekee
      päättelystä pätevän, etiikka eli mikä on oikein ja hyvää, yhteiskuntafilosofia eli oikeudenmukaisuus, valta ja
      vapaus, sekä estetiikka eli kauneus ja taide.
    expected_labels:
      - "Filosofia"
      - "Metafysiikka:"
      - "mitä on olemassa"
      - "Tietoteoria:"
      - "mitä tieto on"
      - "Logiikka:"
      - "mikä tekee"
      - "päättelystä"
      - "pätevän"
      - "Etiikka:"
      - "mikä on oikein"
      - "ja hyvää"
      - "Yhteiskuntafilosofia:"
      - "oikeudenmukaisuus,"
      - "valta ja vapaus"
      - "Estetiikka:"
      - "kauneus ja taide"
    facts_from:
      - {topic: fi1-01-mita-filosofia-on, section: "Opiskelijalle / Filosofian osa-alueet"}
