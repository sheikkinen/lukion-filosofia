# Everything subject-specific, read by the shared engine lukio-runko (pinned in requirements.txt).
# The topic sections follow docs/content-contract.md; what the engine cannot yet render is in docs/engine-issues.md.

site:
  name: Lukion filosofia
  short_name: fi                  # prefix of the environment variables (FI_TODAY)
  base_url: https://sheikkinen.github.io/lukion-filosofia/
  storage_key: "fi:v1"            # the one localStorage key of the self-study path
  # The footer licence line (HTML). {site_name} and {base_url} are filled in from above.
  licence: >-
    Sisältö: <a href="https://creativecommons.org/licenses/by/4.0/deed.fi" rel="license">CC BY 4.0</a>.
    Lainaa ja muokkaa vapaasti, kun mainitset lähteen: {site_name}, {base_url}.
    Opetussuunnitelman tekstit: Opetushallitus (ePerusteet).

# The teacher role, as the lesson views and the front page name it.
teacher:
  door: Opettajalle                     # front page door heading
  label: opettajalle                    # "Tuntisuunnitelma opettajalle", "Aihe 01 · opettajalle"
  role_column: Opettajan rooli          # the teacher's column in every lesson plan table

# ePerusteet: the core curriculum (peruste), the subject (oppiaine) and its modules.
curriculum:
  peruste_id: 6828810
  oppiaine_id: 6832794
  code: FI                              # prefix of the subject's general objectives: FI.yt1
  general_aims_route: opetussuunnitelma # the page that lists the general objectives
  modules:
    - {code: FI1, id: 6833502, route: fi1}
  expected_counts:                      # the fetch fails if ePerusteet has a different number of codes
    FI.yt: 6
    FI1.t: 5
    FI1.s: 5

topics:
  max_order: 30
  extra_fields:                         # optional front-matter fields, shown as a meta row on both views
    - key: content_note
      label: Sisältöhuomautus

# A matriculation exam subject: a grade 4-10, with exam tasks and model answers.
assessment: numeric

# The H2 sections of a topic, in the order of docs/content-contract.md. view: student or lesson.
# The Tuntisuunnitelma section is matched by prefix; its 60 and 45 min plans are ### headings inside it.
# Lähteet is generated by the engine. Linkitetyt materiaalit is not yet rendered (docs/engine-issues.md).
contract:
  sections:
    - {title: Opiskelijalle, id: opiskelijalle, view: student}
    - {title: Tehtävät, id: tehtavat, view: student}
    - {title: Pohdinta, id: pohdinta, view: student}
    - {title: Itseopiskelun askel, id: itseopiskelun-askel, view: student, tick: true}
    - {title: Tuntisuunnitelma, id: tuntisuunnitelma, view: lesson, plan: true}
    - {title: Eriyttäminen, id: eriyttaminen, view: lesson}
    - {title: Apua ja tukea, id: apua-ja-tukea, view: student}
  assessment:
    numeric:
      label: arvosana 4–10
      add:                              # inserted after the named section; checked by the build
        - {title: Koetehtävät, id: koetehtavat, view: student, after: Pohdinta}
        - {title: Mallivastaukset, id: mallivastaukset, view: student, after: Koetehtävät}
