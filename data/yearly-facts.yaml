- key: mieli_ilmastoahdistus
  rule: MIELIn sivu kertoo ilmastoahdistuksesta, jota se kuvaa lähtökohtaisesti ymmärrettäväksi reaktioksi ympäristöongelmien suuruuteen eikä sairaudeksi. Sivu on lukemista, ei apupalvelu.
