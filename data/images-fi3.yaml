      lähtee nuoli viiteen allekkaiseen laatikkoon: julkisuus, säännöt tiedetään ennen soveltamista; yhdenvertaisuus,
      sama laki koskee kaikkia; takautumattomuus, teosta ei rangaista, jos se oli tekohetkellä sallittu;
