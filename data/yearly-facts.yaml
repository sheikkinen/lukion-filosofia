- key: filosofian_koe_rakenne
  rule: Filosofian ylioppilaskokeessa on yhdeksän tehtävää, joista kokelas vastaa viiteen. Osassa 1 on kuusi 20 pisteen tehtävää, joista vastataan kolmeen–viiteen, ja osassa 2 kolme 30 pisteen tehtävää, joista vastataan nollaan–kahteen. Sivuston omat koetehtävät noudattavat tätä rakennetta.
  url: https://tiedostot.ylioppilastutkinto.fi/kokeet/2025-03-21_FF_fi/grading-instructions.html
  publisher: Ylioppilastutkintolautakunta
  read: '2026-11-22'
  stable_figures: ['20 p', '30 p', '10 p', '5 p']
  note: Kevään 2025 hyvän vastauksen piirteet, päivätty 21.3.2025, lopulliset 13.5.2025 (luettu). Sivulla rakenne ja enimmäispisteet 120 sekä kuuden osan 1 tehtävän ja kolmen osan 2 tehtävän pisteet. Rakenne voi muuttua, joten tarkista uusimmasta kokeesta. Tehtäviä ei kopioida eikä mukailla.
