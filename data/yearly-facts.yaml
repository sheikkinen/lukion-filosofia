# Muuttuvat tiedot: vakaa sääntö omin sanoin ja linkki virallisen lähteen sivulle. Lukuja ei kopioida, paitsi kokeen rakenne, joka on listattu kentässä stable_figures.
checked: '2026-11-22'
facts:
- key: filosofian_koe_rakenne
  rule: Filosofian ylioppilaskokeessa on yhdeksän tehtävää, joista kokelas vastaa viiteen. Osassa 1 on kuusi 20 pisteen tehtävää, joista vastataan kolmeen–viiteen, ja osassa 2 kolme 30 pisteen tehtävää, joista vastataan nollaan–kahteen. Sivuston omat koetehtävät noudattavat tätä rakennetta.
  url: https://tiedostot.ylioppilastutkinto.fi/kokeet/2025-03-21_FF_fi/grading-instructions.html
  publisher: Ylioppilastutkintolautakunta
  read: '2026-11-22'
  stable_figures: ['20 p', '30 p', '10 p', '5 p']
  note: Kevään 2025 hyvän vastauksen piirteet, päivätty 21.3.2025, lopulliset 13.5.2025 (luettu). Sivulla rakenne ja enimmäispisteet 120 sekä kuuden osan 1 tehtävän ja kolmen osan 2 tehtävän pisteet. Rakenne voi muuttua, joten tarkista uusimmasta kokeesta. Tehtäviä ei kopioida eikä mukailla.
- key: filosofian_koe_vastauksen_arviointi
  rule: Filosofian vastauksen arvioinnissa painavimmat kohdat ovat osuvuus, eheys ja vakuuttavuus. Sivuston pisteytysohje on sivuston oma harjoitusohje, ei ylioppilastutkintolautakunnan.
  url: https://tiedostot.ylioppilastutkinto.fi/kokeet/2025-03-21_FF_fi/grading-instructions.html
  publisher: Ylioppilastutkintolautakunta
  read: '2026-11-22'
  note: Sama sivu, luettu 22.11.2026 (kohta Filosofian ylioppilaskokeen vastausten arviointi, osuvuus, eheys ja vakuuttavuus). Pisteytyskynnykset eivät ole tekstissä.
- key: opetussuunnitelma_tarkistus
  rule: Sivuston opetussuunnitelmatekstit ja koodit haetaan ePerusteet-palvelun rajapinnasta ja tarkistetaan julkaisun yhteydessä. Tarkka voimassa oleva sanamuoto on ePerusteissa.
  url: https://eperusteet.opintopolku.fi/eperusteet-service/api/perusteet/6828810/kaikki
  publisher: Opetushallitus (ePerusteet)
  read: '2026-11-22'
  note: Lukion opetussuunnitelman perusteet 2019, diaarinumero OPH-2263-2019; tietueen viimeisin julkaisupäivä 22.5.2026 (data/curriculum.yaml, haettu 22.11.2026). Ensisijainen tarkistussivu on rajapinta, joka palauttaa koneluettavan tietueen.
- key: oph_filosofia_tukimateriaali
  rule: Opetushallitus ylläpitää filosofian LOPS-tukimateriaalien sivuja opettajille. Sivusto linkittää ne eikä kopioi niitä.
  url: https://www.oph.fi/fi/koulutus-ja-tutkinnot/filosofian-lops-tukimateriaalit
  publisher: Opetushallitus
  read: '2026-11-22'
  note: Sivu avattu 22.11.2026 (200); linkit alasivuihin muuttuvat, joten vain hakemistosivu.
- key: tekijanoikeus_sitaatti_suoja_aika
  rule: Tekijänoikeus on voimassa, kunnes 70 vuotta on kulunut tekijän kuolinvuodesta, ja julkistetusta teoksesta saa hyvän tavan mukaisesti ottaa lainauksia tarkoituksen edellyttämässä laajuudessa. Sivusto lainaa alkuperäistekstit vain tekijöiltä, joiden suoja-aika on päättynyt, ja suomentaa itse tai nimeää suomentajan.
  url: https://www.finlex.fi/fi/lainsaadanto/1961/404
  publisher: Finlex (oikeusministeriö)
  read: '2026-11-22'
  note: Tekijänoikeuslain 43 § (suoja-aika) ja 22 § (sitaatti) luettu Finlexin avoimesta rajapinnasta 22.11.2026 (ajantasainen teksti, 200, XML); selainsivu vaatii JavaScriptin eikä avautunut tekstinä. Lain tulkinta kuuluu juristille.
- key: ihmisoikeuksien_julistus_suomeksi
  rule: YK:n ihmisoikeuksien yleismaailmallinen julistus (1948) on julistus, jonka ensimmäinen artikla toteaa kaikkien ihmisten syntyvän vapaina ja tasavertaisina arvoltaan ja oikeuksiltaan. Suomenkielinen teksti on Ihmisoikeusliiton sivulla; sivuston omissa suomennoksissa ei käytetä tämän sivun sanamuotoa.
  url: https://ihmisoikeusliitto.fi/ihmisoikeudet/ihmisoikeuksien-julistus/
  publisher: Ihmisoikeusliitto
  read: '2026-11-22'
  note: Sivu avattu 22.11.2026 (200); löytyi Ihmisoikeudet.net-sivun linkistä (ihmisoikeudet.net/jarjestelmat/ykn-ihmisoikeussopimukset/ihmisoikeuksien-yleismaailmallinen-julistus/, 200, yleiskuvaus julistuksen oikeudellisesta asemasta, ei artikloita). Lisenssimerkintää ei löytynyt, joten tekstiä ei kopioida; vain linkki ja viittaus artiklan numeroon. Englanninkielinen teksti ja YK:n sivu ovat aineistolistassa.
- key: perustuslaki_perusoikeudet
  rule: Suomen perustuslain 2 luku (6–23 §) säätää perusoikeuksista, esimerkiksi yhdenvertaisuudesta (6 §), sananvapaudesta (12 §) ja oikeusturvasta (21 §). Perusoikeudet ovat kansallisesti säädettyjä oikeuksia, ihmisoikeudet taas kansainvälisen oikeuden perusteella tunnustettuja.
  url: https://www.finlex.fi/fi/lainsaadanto/1999/731
  publisher: Finlex (oikeusministeriö)
  read: '2026-11-22'
  note: Selainsivu (200, otsikko Suomen perustuslaki 731/1999) ei avautunut tekstinä ilman JavaScriptiä, joten 2 luvun teksti luettiin Finlexin avoimesta rajapinnasta (opendata.finlex.fi, statute-consolidated 1999/731, suomenkielinen versio, 200, XML). Rajapinnan metatiedon mukaan yhdistetty versio on päivätty 5.10.2018 (fin@20180817), joten ajantasaisuus tarkistetaan Finlexin sivulta. Luvun pykälät 6 §:stä 23 §:ään luettu. Lain tulkinta kuuluu juristille.
- key: perustuslaki_vallanjako
  rule: Suomen perustuslain 2 §:n mukaan valtiovalta kuuluu kansalle ja julkisen vallan käytön tulee perustua lakiin, ja 3 §:n mukaan lainsäädäntövaltaa käyttää eduskunta, hallitusvaltaa tasavallan presidentti ja valtioneuvosto ja tuomiovaltaa riippumattomat tuomioistuimet. Aihe kertoo tämän omin sanoin esimerkkinä vallanjaosta; tarkka sanamuoto ja muutokset ovat Finlexissä.
  url: https://www.finlex.fi/fi/lainsaadanto/1999/731
  publisher: Finlex (oikeusministeriö)
  read: '2026-11-22'
  note: Luettu Finlexin avoimen rajapinnan tekstistä (statute-consolidated 1999/731, suomenkielinen versio, 200, XML; selainsivu ei avaudu tekstinä ilman JavaScriptiä), 1 luvun 2 § ja 3 §. Rajapinnan versiotunniste fin@20180817, joten ajantasaisuus tarkistetaan Finlexin sivulta. Lain tulkinta kuuluu juristille. Ei apupalvelua; FI3:n aiheissa ei tarvita uusia apupalveluja, vaan aiheiden apuruutuun käytetään tässä tiedostossa jo olevia palveluja (112, Sekasin, Mielenterveystalo nuoret, MLL).
- key: tenk_hyva_tieteellinen_kaytanto
  rule: Tutkimuseettinen neuvottelukunta (TENK) kuvaa hyvän tieteellisen käytännön periaatteina luotettavuuden, rehellisyyden, arvostuksen ja vastuunkannon. Tiedevilppi jaetaan Suomessa kolmeen alaluokkaan, jotka ovat sepittäminen, vääristely ja plagiointi; tieteelliset näkemyserot eivät ole sellaisenaan tiedevilppiä. Ohjeiden tarkka sanamuoto ja prosessit ovat TENKin sivulla.
  url: https://tenk.fi/fi/hyva-tieteellinen-kaytanto/tiedevilppi
  publisher: Tutkimuseettinen neuvottelukunta (TENK)
  read: '2026-11-22'
  note: Sivu avattu 22.11.2026 (200) ja luettu (tiedevilpin määritelmä ja kolme alaluokkaa); periaatteet luettu sivulta tenk.fi/fi/hyva-tieteellinen-kaytanto-htk (vanha osoite tenk.fi/fi/hyva-tieteellinen-kaytanto ohjautuu sinne). HTK-ohje 2023 -PDF avautuu (200), mutta sen tekstiä ei luettu tässä ajossa. Lisenssiä ei ilmoitettu, joten tekstiä ei kopioida. Ei apupalvelu eikä kokeen rakenne.
