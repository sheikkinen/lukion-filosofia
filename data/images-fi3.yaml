      - {topic: fi3-03-poliittinen-vapaus, section: "Opiskelijalle / Kielteinen ja myönteinen vapaus (taulukko)"}
      - {topic: fi3-03-poliittinen-vapaus, section: "Opiskelijalle / Vahinkoperiaate (Lähdeteksti 1)"}
  - id: dg-fi3-oikeusvaltio
    kind: diagram
    model: nano-banana
    fallback: svg
    aspect: "3:5"
    page: fi3-05-oikeusvaltio-ja-demokratia
