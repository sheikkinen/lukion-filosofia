checked: '2026-11-22'
note: 'FI2-aiheet ovat tiedostossa data/materials-fi2.yaml. Linkitetyt materiaalit per FI1-aihe, kriitikon linkkiluettelosta
  (docs/research/2026-11-22-scouting.json, ehdotus 3). Jokainen osoite avattu 22.11.2026 (Python, enintään kaksi
  yritystä). Linkit, ei kopioita (CLAUDE.md sääntö 6). Lisenssiluokka: open-cc-by-sa (vain linkki) tai link-out
  (kaikki oikeudet pidätetään); luokka link-out on varmuuden vuoksi annettu kaikille, joiden lisenssiä ei ole luettu;
  Tieteen termipankin lisenssi on luettu sivun alatunnisteesta. Lista excluded on pelkkä kirjaus eikä tule näkyviin.
  Aiheiden front matter on lopullinen lähde: kirjoittajat poimivat sieltä linkit, ja jokainen ei-poissuljettu merkintä
  on myös kentässä official_links. Alkuperäistekstien (Perseus, Wikisource) osoitteet ovat kirjoittajien official_links-kentissä.
  FI2-aiheiden listat on koottu kriitikon linkkiluettelosta (docs/research/2026-11-22-fi2-scouting.json, ehdotus
  2) ja jokainen osoite on avattu 22.11.2026; siirtyneet osoitteet (ilmastopaneeli.fi, MLL, Nuorten Exit, MIELI)
  on korjattu, ja aiheessa 20 yksi kuudennen paikan ulkopuolelle jäänyt sivu on kirjattu listaan excluded. Crash
  Course -videoiden osoitteet on poimittu sarjan aihesivulta ja avattu.'
